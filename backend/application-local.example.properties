# Local-only configuration: copy to backend/application-local.properties and edit.
app.mode=interview_mode
spring.datasource.url=jdbc:mysql://localhost:3306/interviewbot?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
# Supply these environment variables, or edit the ignored copy of this file.
spring.datasource.username=${DB_USERNAME:}
spring.datasource.password=${DB_PASSWORD:}
interview.agent.model=qwen3:8b
interview.judge.model=qwen3:4b
interview.judge.thinking-enabled=false
question-bank.provider=ollama
question-bank.base-url=http://localhost:11434
question-bank.model=qwen3:8b
question-bank.agents.generation.thinking-enabled=true
question-bank.agents.validation.thinking-enabled=true
# For generation mode, set app.mode=generation_mode and restart.
# Set a random GENERATION_ADMIN_KEY before exposing generation controls beyond loopback.
# Use app.cors.allowed-origins to list the exact frontend origins for your deployment.
