spring.datasource.url=jdbc:h2:mem:questionbank;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.flyway.enabled=true

question-bank.scheduling-enabled=false
question-bank.generation-batch-size=2
question-bank.validation-batch-size=2
question-bank.retry-limit=1
question-bank.cycle-timeout-seconds=2
question-bank.minimum-frequency-seconds=10
question-bank.agents.generation.model=writer-test
question-bank.agents.validation.model=reviewer-test
logging.level.org.hibernate=warn
logging.level.org.springframework=warn
question-bank.validation-request-size=1
app.mode=generation_mode

