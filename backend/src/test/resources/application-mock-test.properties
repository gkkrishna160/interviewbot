spring.datasource.url=jdbc:h2:mem:mockinterview;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.flyway.placeholders.legacyBackupDirectory=target/test-schema-backups
app.mode=interview_mode
question-bank.scheduling-enabled=true
logging.level.org.springframework=warn
