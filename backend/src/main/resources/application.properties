spring.application.name=interviewbot-backend
server.port=8080
spring.config.import=optional:file:./src/main/resources/application-local.properties,optional:file:./application-local.properties

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/interviewbot?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

llm.provider=${LLM_PROVIDER:ollama}
llm.ollama.base-url=${OLLAMA_BASE_URL:http://localhost:11434}
llm.ollama.model=${OLLAMA_MODEL:llama3.2:3b}
llm.ollama.connect-timeout-seconds=${OLLAMA_CONNECT_TIMEOUT_SECONDS:5}
llm.ollama.read-timeout-seconds=${OLLAMA_READ_TIMEOUT_SECONDS:30}
interview.max-questions=${INTERVIEW_MAX_QUESTIONS:6}

spring.jackson.default-property-inclusion=non_null
