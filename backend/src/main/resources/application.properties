# Shared configuration: safe to commit. Supply credentials through environment
# variables or an ignored application-local.properties file.
spring.application.name=interviewbot-backend
server.port=8080
spring.config.import=optional:file:./src/main/resources/application-local.properties,optional:file:./application-local.properties,optional:file:./backend/src/main/resources/application-local.properties,optional:file:./backend/application-local.properties

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/interviewbot?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.default_batch_fetch_size=50

# Existing installations have no migration history; baseline at 0 then apply additive bank migrations.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

question-bank.scheduling-enabled=${QUESTION_BANK_SCHEDULING_ENABLED:true}
question-bank.schedule-delay-ms=${QUESTION_BANK_SCHEDULE_DELAY_MS:60000}
question-bank.initial-delay-ms=${QUESTION_BANK_INITIAL_DELAY_MS:30000}
question-bank.generation-batch-size=${QUESTION_BANK_GENERATION_BATCH_SIZE:10}
question-bank.minimum-questions-per-topic=${QUESTION_BANK_MINIMUM_QUESTIONS_PER_TOPIC:15}
question-bank.minimum-frequency-seconds=${QUESTION_BANK_MINIMUM_FREQUENCY_SECONDS:60}
question-bank.validation-request-size=${QUESTION_BANK_VALIDATION_REQUEST_SIZE:5}
question-bank.validation-batch-size=${QUESTION_BANK_VALIDATION_BATCH_SIZE:10}
question-bank.retry-limit=${QUESTION_BANK_RETRY_LIMIT:2}
question-bank.execution-timeout-seconds=${QUESTION_BANK_EXECUTION_TIMEOUT_SECONDS:180}
question-bank.cycle-timeout-seconds=${QUESTION_BANK_CYCLE_TIMEOUT_SECONDS:1800}
question-bank.max-llm-calls=${QUESTION_BANK_MAX_LLM_CALLS:8}
question-bank.similarity-candidates=${QUESTION_BANK_SIMILARITY_CANDIDATES:10}
question-bank.minimum-quality-score=${QUESTION_BANK_MINIMUM_QUALITY_SCORE:70}
question-bank.minimum-relevance-score=${QUESTION_BANK_MINIMUM_RELEVANCE_SCORE:70}
question-bank.provider=${QUESTION_BANK_PROVIDER:ollama}
question-bank.base-url=${QUESTION_BANK_BASE_URL:http://localhost:11434}
question-bank.model=${QUESTION_BANK_MODEL:qwen3:8b}
question-bank.api-key=${QUESTION_BANK_API_KEY:}
question-bank.model-options.temperature=${QUESTION_BANK_MODEL_TEMPERATURE:0.3}
question-bank.model-options.max-output-tokens=${QUESTION_BANK_MODEL_MAX_OUTPUT_TOKENS:8192}
question-bank.model-options.context-window=${QUESTION_BANK_MODEL_CONTEXT_WINDOW:8192}
question-bank.model-options.thinking-enabled=${QUESTION_BANK_MODEL_THINKING_ENABLED:false}

# Specialists reason independently; each model can be changed without changing agent code.
question-bank.agents.generation.model=${QUESTION_BANK_GENERATION_MODEL:${question-bank.model}}
question-bank.agents.generation.thinking-enabled=${QUESTION_BANK_GENERATION_THINKING_ENABLED:true}
question-bank.agents.generation.temperature=${QUESTION_BANK_GENERATION_TEMPERATURE:0.6}
question-bank.agents.generation.max-output-tokens=${QUESTION_BANK_GENERATION_MAX_OUTPUT_TOKENS:8192}
question-bank.agents.generation.timeout-seconds=${QUESTION_BANK_GENERATION_TIMEOUT_SECONDS:600}
question-bank.agents.validation.model=${QUESTION_BANK_VALIDATION_MODEL:${question-bank.model}}
question-bank.agents.validation.thinking-enabled=${QUESTION_BANK_VALIDATION_THINKING_ENABLED:true}
question-bank.agents.validation.temperature=${QUESTION_BANK_VALIDATION_TEMPERATURE:0.6}
question-bank.agents.validation.max-output-tokens=${QUESTION_BANK_VALIDATION_MAX_OUTPUT_TOKENS:8192}
question-bank.agents.validation.timeout-seconds=${QUESTION_BANK_VALIDATION_TIMEOUT_SECONDS:360}

#user app.mode=generation_mode for generating questions
app.mode=${APP_MODE:interview_mode}
interview.agent.model=${INTERVIEW_AGENT_MODEL:qwen3:8b}
interview.agent.timeout-seconds=${INTERVIEW_AGENT_TIMEOUT_SECONDS:360}
# Only the interactive judge uses a smaller, non-thinking model.
interview.judge.model=${INTERVIEW_JUDGE_MODEL:qwen3:4b}
interview.judge.thinking-enabled=${INTERVIEW_JUDGE_THINKING_ENABLED:false}
interview.judge.max-output-tokens=${INTERVIEW_JUDGE_MAX_OUTPUT_TOKENS:1024}
interview.judge.context-window=${INTERVIEW_JUDGE_CONTEXT_WINDOW:8192}
interview.judge.timeout-seconds=${INTERVIEW_JUDGE_TIMEOUT_SECONDS:90}
interview.signing-key=${INTERVIEW_SIGNING_KEY:}
app.database.backup-directory=${DATABASE_BACKUP_DIRECTORY:./backups}
spring.jackson.default-property-inclusion=non_null

spring.flyway.placeholders.legacyBackupDirectory=${app.database.backup-directory:./backups}
app.database.allow-migrations=${ALLOW_DATABASE_MIGRATIONS:true}
server.address=${SERVER_ADDRESS:127.0.0.1}
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s
server.tomcat.threads.max=50
server.tomcat.accept-count=50
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.connection-timeout=10000
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
app.security.max-concurrent-ai-requests=${MAX_CONCURRENT_AI_REQUESTS:2}
app.security.ai-requests-per-minute=${AI_REQUESTS_PER_MINUTE:90}
app.security.max-request-bytes=262144
app.security.generation-admin-key=${GENERATION_ADMIN_KEY:}
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
logging.file.name=${APPLICATION_LOG_FILE:./logs/interviewbot.log}
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=7
logging.logback.rollingpolicy.total-size-cap=100MB
logging.pattern.level=%5p [%X{requestId:-}]
