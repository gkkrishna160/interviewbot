name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci-fixture-only-password
          MYSQL_DATABASE: interviewbot
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pci-fixture-only-password"
          --health-interval=10s --health-timeout=5s --health-retries=10
    env:
      QUESTION_BANK_LIVE_REASONING_TEST: "false"
      INTERVIEWBOT_MYSQL_SMOKE: "true"
      MYSQL_SMOKE_URL: "jdbc:mysql://127.0.0.1:3306/interviewbot?allowPublicKeyRetrieval=true&useSSL=false"
      MYSQL_SMOKE_USER: root
      MYSQL_SMOKE_PASSWORD: ci-fixture-only-password
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: backend/pom.xml
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: node scripts/check-repository.mjs
      - run: mvn -B -f backend/pom.xml verify
      - run: node scripts/check-repository.mjs --artifact
      - run: npm --prefix frontend ci
      - run: npm --prefix frontend test
      - run: npm --prefix frontend run build
      - run: npm --prefix frontend audit --audit-level=moderate
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm --prefix frontend run test:e2e
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: failure()
        with:
          name: browser-test-failures
          path: |
            frontend/playwright-report/
            frontend/test-results/
            backend/target/e2e-output/
          retention-days: 7
